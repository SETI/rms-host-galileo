[build-system]
requires = ["setuptools>=77", "setuptools_scm[toml]"]
build-backend = "setuptools.build_meta"

[project]
name = "rms-host-galileo"
dynamic = ["version"]
description = "Galileo mission host (SSI) for the OOPS observation geometry toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cspyce",
  "numpy>=2.0",
  "rms-filecache>=2.0.3",
  "rms-julian",
  # Also provides spicedb.
  "rms-oops",
  "rms-pdsparser>=2.3.0",   # 2.3.0 adds as_dict
  "rms-vicar>=1.4.0",       # 1.4.0 adds as_dict
]
license = "Apache-2.0"
authors = [
  {name = "Mark R. Showalter", email = "mshowalter@seti.org"}
]
maintainers = [
  {name = "Mark R. Showalter", email = "mshowalter@seti.org"}
]
keywords = ["oops", "galileo", "ssi", "spice"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Natural Language :: English",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows"
]

[project.urls]
Homepage = "https://github.com/SETI/rms-host-galileo"
Documentation = "https://rms-host-galileo.readthedocs.io/en/latest"
Repository = "https://github.com/SETI/rms-host-galileo"
Source = "https://github.com/SETI/rms-host-galileo"
Issues = "https://github.com/SETI/rms-host-galileo/issues"

[project.optional-dependencies]
dev = [
  "codespell>=2.4",
  "coverage>=7.0",
  "flake8",
  "mypy>=1.0",
  "pip-audit>=2.7",
  "pymarkdownlnt>=0.9.35",
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "pytest-xdist>=3.8.0",
  "ruff>=0.8",
  # "bandit[toml]>=1.8",
  "pyroma>=4.2",
  # "vulture>=2.14",
  "rms-host-galileo[docs]",
]
docs = [
  "myst-parser",
  "sphinx>=7",
  "sphinxcontrib-mermaid",
  "sphinx-rtd-theme",
]

[tool.pytest.ini_options]
pythonpath = [
  "src"
]
testpaths = ["tests"]
addopts = ["-n", "auto", "--cov=src/host_galileo", "--strict-markers", "--strict-config"]
markers = []
filterwarnings = [
  "error",
  # rms-pdstable assigns to ndarray.dtype when reading fixed-length tables, which NumPy
  # 2.5 deprecates; the fix belongs in rms-pdstable.
  "ignore:Setting the dtype on a NumPy array has been deprecated:DeprecationWarning:pdstable",
]

[tool.setuptools]
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
host_galileo = ["py.typed"]

[tool.setuptools_scm]
local_scheme = "no-local-version"
write_to = "src/host_galileo/_version.py"

# Tool configuration

[tool.coverage.run]
branch = true
parallel = true
# Must match --cov in the pytest addopts above, or fail_under measures something else
source = ["src/host_galileo"]
omit = ["tests/*", "_version.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise NotImplementedError",
]
fail_under = 65

[tool.mypy]
strict = true

# src is deliberately unannotated (see .claude/rules/python.md), so mypy checks only the
# tests and treats everything imported from host_galileo as Any.
[[tool.mypy.overrides]]
module = ["host_galileo", "host_galileo.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["cspyce", "cspyce.*", "julian", "julian.*"]
ignore_missing_imports = true

# attr-defined is off in the tests for two reasons that no change to the tests can fix:
#   - Observation subfields such as filter and time_from_sclk are attached at runtime
#     by insert_subfield(), so no declaration of them can exist.
#   - The oops and spicedb stubs do not yet declare oops.Host, oops.host or
#     spicedb.KERNEL_TYPE_SORT_ORDER.
[[tool.mypy.overrides]]
module = ["conftest", "test_galileo", "test_ssi"]
disable_error_code = ["attr-defined"]

[tool.ruff]
target-version = "py311"
# Must match max-line-length in .flake8.
line-length = 90

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
# E, W = pycodestyle errors/warnings; F = Pyflakes; I = isort; UP = pyupgrade;
# B = bugbear; SIM = simplify; C4 = comprehensions; A = builtins (no shadowing);
# N = pep8-naming; PT = pytest-style; RUF = Ruff-specific (e.g. unused noqa).
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "A", "N", "PT", "RUF"]
# PT011 - pytest.raises is too broad.
# SIM105 - Use contextlib.suppress for suppressions.
# SIM108 - Use ternary operator for simple if/else.
# I001 - Import sorting. The fix collapses the column-aligned `import` keywords
#   this codebase uses (the same alignment .flake8 preserves by ignoring E221).
# RUF005 - Collection literal concatenation. `[a] + list_` is the preferred style here.
extend-ignore = ["PT011", "SIM105", "SIM108", "I001", "RUF005"]

[tool.ruff.lint.flake8-builtins]
# A002 and the other A rules still apply to every other builtin. oops.Host sets the
# `filter` keyword of from_index(), so every host must accept that name.
ignorelist = ["filter"]

[tool.ruff.lint.per-file-ignores]
# E501: test files are exempt from the line length limit so that expected-value
#   tables can stay aligned and readable.
"tests/*" = ["E501"]

# A001: Sphinx reads the project's copyright from a module variable named `copyright`.
"docs/conf.py" = ["A001"]

# RUF012 wants ClassVar annotations, but annotations are not permitted anywhere
# under src (see .claude/rules/python.md), so the rule cannot be satisfied.
"src/*" = ["RUF012"]

[tool.codespell]
# Two dictionaries: the default typo list, and the British-to-American list that
# enforces the spelling rule in .claude/rules/doc_python.md.
builtin = "clear,en-GB_to_en-US"
# The builtin British list carries a base word but not every inflection, so it
# catches `catalogue` and lets `catalogued` through. `.codespell-dictionary.txt`
# adds the inflections this tree uses, in codespell's `wrong->right` format --
# one pair per line, no comments or blank lines, which that parser rejects. The
# `-` is what keeps the builtins above: naming a dictionary without it replaces
# them rather than extending them, and it trails the filename because a value
# opening with `-` reads as another flag.
dictionary = ".codespell-dictionary.txt,-"
# Split on everything that is not an ASCII letter. The default word pattern
# keeps hyphens and apostrophes, which hides two whole classes: a compound like
# `optical-centre` is one unknown token, and -- because this project quotes
# strings with single quotes -- so is every string literal, `'colour'` included.
regex = "[a-zA-Z]+"
# *.egg-info holds the build metadata, whose commit hashes can read as misspellings.
skip = "*.egg-info,*/.git/*,*/_build/*,*/venv/*,*/.venv/*,*.lock,*.png,*.jpg,*.svg"

[tool.pymarkdown.extensions.front-matter]
# The rules and skills under .claude/ open with a YAML front-matter block, which would
# otherwise be read as a setext heading.
enabled = true

[tool.pymarkdown.plugins.md013]
# Line length (disable so README/CONTRIBUTING can use longer lines).
enabled = false

[tool.pymarkdown.plugins.md033]
# Inline HTML (e.g. <br>) allowed in Markdown.
enabled = false

# Uncomment when enabling bandit in [project.optional-dependencies].dev.
# [tool.bandit]
# exclude_dirs = ["tests", "venv", ".venv"]
# targets = ["src"]

# Uncomment when enabling vulture in [project.optional-dependencies].dev.
# [tool.vulture]
# paths = ["src"]
# exclude = ["tests/"]
# min_confidence = 70
