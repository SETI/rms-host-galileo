name: Run Tests
run-name: Run Tests triggered by ${{ github.ref_type }} ${{ github.ref_name }} or ${{ github.triggering_actor }}

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: "21 11 * * 0"

jobs:
  lint:
    name: Lint rms-host-galileo
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: 3.13

      - name: Install dependencies
        run: |
          python -m pip install -e ".[dev]"

      # Ruff is the linter of record for every rule it implements.
      - name: Ruff
        run: |
          ruff check src tests

      # Ruff implements no rule in the E121-E133 range, so continuation-line
      # indentation is the one pycodestyle family it cannot gate. This step matches
      # `--flake8-cont` in scripts/run-all-checks.sh and reads the per-file-ignores in
      # .flake8.
      - name: Flake8 continuation-line indent
        run: |
          flake8 --select=E12,E13 src tests

      # Every module under tests/ is checked. src/ is deliberately unannotated, so
      # mypy treats it as Any through the overrides in pyproject.toml; this step
      # matches `--mypy` in scripts/run-all-checks.sh.
      - name: Mypy
        run: |
          MYPYPATH=src mypy tests

      - name: pip-audit
        run: |
          pip-audit --skip-editable

      - name: Pyroma
        run: |
          pyroma .

      # The two published stubs, the __init__.pyi of host_galileo and of host_galileo.oops,
      # must keep describing the runtime API. The allowlist accepts only the deliberate
      # absence of a stub for the internal ssi module.
      - name: Stubtest
        run: |
          python -m mypy.stubtest host_galileo --mypy-config-file pyproject.toml --allowlist .stubtest-allowlist

      # -W makes warnings errors and -n (nitpicky) makes a cross-reference with no
      # target one of them.
      - name: Sphinx
        run: |
          sphinx-build -W -n -b html docs docs/_build

      - name: Codespell
        run: |
          codespell src tests docs scripts README.md CONTRIBUTING.md CLAUDE.md

      - name: PyMarkdown
        run: |
          pymarkdown scan -r docs/ .claude/ README.md CONTRIBUTING.md CLAUDE.md

  test:
    name: Test rms-host-galileo
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
      fail-fast: false
    permissions:
      contents: read
      # Lets the Codecov upload authenticate with a GitHub OIDC token instead of a secret.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install -e ".[dev]"

      # The tests need no SPICE kernels or data files; see tests/oops/conftest.py.
      - name: Test with coverage
        run: |
          python -m pytest --cov-report=xml

      - name: Print coverage report
        run: |
          coverage report -m

      - name: Upload coverage report to codecov
        uses: codecov/codecov-action@v7
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' && !github.event.pull_request.head.repo.fork
        with:
          use_oidc: true
          fail_ci_if_error: true
          verbose: true
